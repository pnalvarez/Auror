name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run unit tests with coverage
        run: flutter test test/unit --coverage

      - name: Enforce minimum line coverage (80%)
        uses: VeryGoodOpenSource/very_good_coverage@v2
        with:
          path: ${{ github.workspace }}/coverage/lcov.info
          min_coverage: 80
          exclude: >-
            **/*.g.dart
            **/*.freezed.dart
            **/*.gr.dart
            **/generated_plugin_registrant.dart

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (app)
        run: flutter pub get

      - name: Generate code (app)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run app UI (widget) tests
        run: flutter test test/ui

      - name: Install dependencies (design system)
        working-directory: packages/auror_design_system
        run: flutter pub get

      - name: Run design system widget tests
        working-directory: packages/auror_design_system
        run: flutter test
